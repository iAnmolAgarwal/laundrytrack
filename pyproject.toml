[project]
name = "laundrytrack"
version = "1.0.0"
description = "Track hostel laundry slips: photograph the paper slip, get a receipt and a pickup reminder by email."
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=6.1,<6.2",
    "anthropic>=2.10",
    "pillow>=11",
    "pillow-heif>=0.20",
    "python-dotenv>=1.0",
    "whitenoise>=6.7",
    "dj-database-url>=2.2",
    "psycopg[binary]>=3.2",
]

[tool.uv]
package = false

# Vercel runs this after installing dependencies, so the database schema is
# always up to date with the deployed code.
[tool.vercel.scripts]
build = "python manage.py migrate --noinput"
